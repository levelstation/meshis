[env:meshis_heltec_v43_r2_oled]
extends = env:heltec_v4_companion_radio_ble
build_unflags = -DDISPLAY_CLASS=SSD1306Display
build_flags = ${env:heltec_v4_companion_radio_ble.build_flags}
  -D DISPLAY_CLASS=SSD1315FramebufferDisplay
  -D BRAND_CLASSIC_UI=1
  -D MESHIS_V2=1
  -D MESHIS_HELTEC_PRG=1
  "-ffile-prefix-map=@BUILD_HOME@=/build-user"
  "-fdebug-prefix-map=@BUILD_HOME@=/build-user"
  -D LU_ALERT_PRESERVE_STORAGE=1
  -D MESHIS_BOARD=1
  -D MESHIS_DEFAULT_PET=0
  -D FIRMWARE_VERSION='"v0.2.0-heltec-dev4"'
  -D FIRMWARE_BUILD_DATE='"26 Nov 2026"'
build_src_filter = ${env:heltec_v4_companion_radio_ble.build_src_filter}
  -<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/SSD1315FramebufferDisplay.cpp>

